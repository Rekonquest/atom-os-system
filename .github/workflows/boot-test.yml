name: Boot Test

on:
  workflow_dispatch:
    inputs:
      daemon_image:
        description: 'program to install as daemon.elf (daemon, hello)'
        required: false
        default: 'daemon'
      payload_image:
        description: 'program to install as payload (shell, hello)'
        required: false
        default: 'shell'
  push:

jobs:
  boot:
    runs-on: ubuntu-latest
    env:
      DAEMON_IMAGE: ${{ inputs.daemon_image || 'daemon' }}
      PAYLOAD_IMAGE: ${{ inputs.payload_image || 'shell' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Install bootimage
        run: cargo install bootimage

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Checkout field substrate (kernel path deps)
        run: git clone --depth 1 https://github.com/Rekonquest/atom-os-field-substrate.git "$GITHUB_WORKSPACE/../ATOM OS"

      - name: Checkout kernel @ last bootable commit
        run: |
          git clone https://github.com/Lucerna-Labs/atom-os-kernel.git "$GITHUB_WORKSPACE/../atom-os-kernel"
          git -C "$GITHUB_WORKSPACE/../atom-os-kernel" checkout b8540ed

      - name: Apply kernel patches
        run: |
          K="$GITHUB_WORKSPACE/../atom-os-kernel"
          git -C "$K" apply "$GITHUB_WORKSPACE/patches/0001-int80-yield-use-switch-result.patch"
          git -C "$K" apply "$GITHUB_WORKSPACE/patches/0002-exec-reset-cr3-and-inject-extra-elfs.patch"
          git -C "$K" apply "$GITHUB_WORKSPACE/patches/0003-ipc-byte-mailboxes-and-frame-recv-pages.patch"
          git -C "$K" apply "$GITHUB_WORKSPACE/patches/0004-xmm-save-restore-in-interrupt-wrappers.patch"
          git -C "$K" apply "$GITHUB_WORKSPACE/patches/0005-sys-spawn-runtime-process-creation.patch"
          git -C "$K" apply "$GITHUB_WORKSPACE/patches/0006-reap-spawned-task-resources-on-exit.patch"
          git -C "$K" apply "$GITHUB_WORKSPACE/patches/0007-free-exec-replaced-address-spaces.patch"
          git -C "$K" apply "$GITHUB_WORKSPACE/patches/0008-ipc-mailbox-ring-queues.patch"

      - name: Build userspace programs
        run: |
          for p in hello daemon shell fieldmon; do
            (cd "programs/$p" && cargo +nightly build -Zjson-target-spec --release)
          done

      - name: Install userspace into kernel image paths
        run: |
          REL="$GITHUB_WORKSPACE/../atom-os-kernel/target/x86_64-os/release"
          mkdir -p "$REL"
          cp "target/x86_64-atom-user/release/$PAYLOAD_IMAGE" "$REL/payload"
          cp "target/x86_64-atom-user/release/$DAEMON_IMAGE" "$REL/daemon"
          # Always stage hello/fieldmon — inject_payloads include_bytes! them.
          cp "target/x86_64-atom-user/release/hello" "$REL/hello"
          cp "target/x86_64-atom-user/release/fieldmon" "$REL/fieldmon"
          echo "payload image: $PAYLOAD_IMAGE / daemon image: $DAEMON_IMAGE"

      - name: Build bootimage
        run: cargo +nightly bootimage -Zjson-target-spec --release
        working-directory: ../atom-os-kernel/x86_64-kernel

      - name: Boot QEMU, inject keyboard, capture serial
        working-directory: ../atom-os-kernel
        run: |
          set -euo pipefail
          rm -f qemu.log qmp.sock
          qemu-system-x86_64 \
            -drive format=raw,file=target/x86_64-os/release/bootimage-x86_64-kernel.bin \
            -display none \
            -serial file:qemu.log \
            -qmp unix:qmp.sock,server,nowait &
          QEMU_PID=$!

          # Wait for QMP socket + shell prompt (banner + HEAP_OK + bench).
          for i in $(seq 1 60); do
            if [ -S qmp.sock ] && grep -q 'HEAP_OK' qemu.log 2>/dev/null \
               && grep -q '10,000 SYS_YIELDs took' qemu.log 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          python3 - <<'PY'
          import json, socket, time, sys

          def qmp(cmd):
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.connect("qmp.sock")
              s.settimeout(5)
              # greeting
              s.recv(4096)
              s.sendall(b'{"execute":"qmp_capabilities"}\n')
              s.recv(4096)
              s.sendall((json.dumps({"execute": cmd} if isinstance(cmd, str) else cmd) + "\n").encode())
              s.recv(4096)
              s.close()

          def sendkey(key):
              qmp({"execute": "send-key", "arguments": {
                  "keys": [{"type": "qcode", "data": key}]
              }})
              time.sleep(0.08)

          # Prove keyboard: type `help` then Enter.
          for k in list("help") + ["ret"]:
              sendkey(k)
          time.sleep(1.0)

          # Prove RamFS listing includes injected ELFs.
          for k in list("ls") + ["ret"]:
              sendkey(k)
          time.sleep(1.0)

          # Prove IPC byte transport: the daemon must print the message text.
          for k in list("msg hello atom") + ["ret"]:
              if k == " ":
                  sendkey("spc")
              else:
                  sendkey(k)
          time.sleep(0.5)

          # Patch 0008: second message back-to-back. Both must sit in the
          # daemon's mailbox ring before its next RECV and be delivered in
          # order — the old single-slot mailbox would have lost this one.
          for k in list("msg queued two") + ["ret"]:
              if k == " ":
                  sendkey("spc")
              else:
                  sendkey(k)
          time.sleep(2.5)

          # Prove SYS_SPAWN: new process runs while the shell stays alive.
          for k in list("spawn hello.elf") + ["ret"]:
              if k == " ":
                  sendkey("spc")
              elif k == ".":
                  sendkey("dot")
              else:
                  sendkey(k)
          time.sleep(2.5)

          # Second spawn: the first hello has exited, so its slot is
          # Terminated and the scheduler reaps it (patch 0006) before
          # reuse. The REAP/LEAK gates below read the diagnostics this
          # prints on serial.
          for k in list("spawn hello.elf") + ["ret"]:
              if k == " ":
                  sendkey("spc")
              elif k == ".":
                  sendkey("dot")
              else:
                  sendkey(k)
          time.sleep(2.5)

          # Prove SYS_EXEC: run fieldmon.elf (replaces shell). Fieldmon is
          # the exec target because it exercises the new root with field
          # syscalls (10 observation rounds) right after EXECFREE released
          # the shell's old address space (patch 0007).
          for k in list("run fieldmon.elf") + ["ret"]:
              # space is qcode "spc", '.' is "dot"
              if k == " ":
                  sendkey("spc")
              elif k == ".":
                  sendkey("dot")
              else:
                  sendkey(k)
          time.sleep(3.0)
          PY

          # Let daemon heartbeats continue briefly, then stop.
          sleep 2
          kill "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true

          echo "==== SERIAL LOG ===="
          cat qemu.log || true

          fail=0
          if grep -q "ATOM OS System shell" qemu.log; then
            echo "BANNER_OK"
          else
            echo "BANNER_MISSING"; fail=1
          fi
          if grep -q "HEAP_OK" qemu.log; then
            echo "HEAP_OK"
          else
            echo "HEAP_MISSING"; fail=1
          fi
          if grep -q "10,000 SYS_YIELDs took" qemu.log; then
            echo "BENCH_OK"
          else
            echo "BENCH_MISSING"; fail=1
          fi
          if grep -q "Daemon" qemu.log; then
            echo "DAEMON_OK"
          else
            echo "DAEMON_MISSING (non-fatal)"
          fi
          if grep -q "commands:" qemu.log; then
            echo "KEYBOARD_OK"
          else
            echo "KEYBOARD_MISSING"; fail=1
          fi
          if grep -q "hello.elf" qemu.log && grep -q "fieldmon.elf" qemu.log; then
            echo "RAMFS_OK"
          else
            echo "RAMFS_MISSING"; fail=1
          fi
          if grep -q "hello from ATOM OS System" qemu.log; then
            # hello prints via the two spawns above; the exec itself targets
            # fieldmon (FIELD_EXEC_OK below) since patch 0007.
            echo "EXEC_OK"
          else
            echo "EXEC_MISSING"; fail=1
          fi
          if grep -q "Received IPC: hello atom" qemu.log; then
            echo "IPC_OK"
          else
            # Byte delivery depends on the daemon's RECV cycle (500k yields)
            # landing inside the window; TCG runners can be too slow for it.
            echo "IPC_MISSING (non-fatal — daemon RECV-cycle timing)"
          fi
          if grep -q "Received IPC: queued two" qemu.log; then
            echo "IPC_QUEUE_OK"
          else
            # Needs TWO daemon RECV cycles inside the window; even more
            # timing-sensitive than IPC_OK on TCG runners.
            echo "IPC_QUEUE_MISSING (non-fatal — daemon RECV-cycle timing)"
          fi
          if grep -q "spawned pid" qemu.log \
             && [ "$(grep -c "hello from ATOM OS System" qemu.log)" -ge 2 ]; then
            # "spawned pid" + hello printed twice: once by the spawned
            # process (shell still alive) and once by the final `run`.
            echo "SPAWN_OK"
          else
            echo "SPAWN_MISSING"; fail=1
          fi
          if grep -q "REAP pid=" qemu.log; then
            echo "REAP_OK"
          else
            echo "REAP_MISSING"; fail=1
          fi
          freed=$(grep -o "REAP pid=[0-9]* freed=[0-9]*" qemu.log | head -1 | sed "s/.*freed=//")
          if [ -n "$freed" ] && [ "$freed" -ge 8 ]; then
            # 4 private page-table frames + kernel stack + image span +
            # 2 user-stack frames is the minimum a spawn can consume.
            echo "REAP_FRAMES_OK (freed=$freed)"
          else
            echo "REAP_FRAMES_LOW (freed=${freed:-none})"; fail=1
          fi
          # Exact leak-closed invariant: the REAP line prints the free-frame
          # count right after returning the dead task's frames; the LAST
          # SPAWN line belongs to the spawn whose slot reuse performed that
          # reap, and its free_before was captured just before that spawn's
          # own allocations. Between the two measurements only that spawn's
          # allocations and the reap happen, so equality proves the reap
          # returned precisely what a spawn consumes. (Daemon IPC RECV
          # caching allocates outside this window and cannot perturb it.)
          before=$(grep -o "SPAWN pid=[0-9]* free_before=[0-9]*" qemu.log | tail -1 | sed "s/.*free_before=//")
          after=$(grep -o "REAP pid=[0-9]* freed=[0-9]* free=[0-9]*" qemu.log | tail -1 | sed "s/.*free=//")
          if [ -n "$before" ] && [ "$after" = "$before" ]; then
            echo "LEAK_CLOSED (free_before=$before free_after_reap=$after)"
          else
            echo "LEAK_OPEN (free_before=${before:-none} free_after_reap=${after:-none})"; fail=1
          fi
          if grep -q "fieldmon: observing" qemu.log; then
            echo "FIELD_EXEC_OK"
          else
            echo "FIELD_EXEC_MISSING"; fail=1
          fi
          # Patch 0007: EXEC must free the replaced address space. Expect
          # >=8 frames (PML4 + 3 private-chain + image span >=1 + 2 user
          # stack) and nothing deferred (no inherited RECV chains here).
          efreed=$(grep -o "EXECFREE pid=[0-9]* freed=[0-9]*" qemu.log | head -1 | sed "s/.*freed=//")
          edefer=$(grep -o "EXECFREE pid=[0-9]* freed=[0-9]* deferred=[0-9]*" qemu.log | head -1 | sed "s/.*deferred=//")
          if [ -n "$efreed" ] && [ "$efreed" -ge 8 ] && [ "${edefer:-X}" = "0" ]; then
            echo "EXECFREE_OK (freed=$efreed deferred=$edefer)"
          else
            echo "EXECFREE_BAD (freed=${efreed:-none} deferred=${edefer:-none})"; fail=1
          fi
          exit $fail
